name: Release

# Tags are the only trigger: pushing vX.Y.Z publishes, everything else just
# runs CI. Tagging rules live in README.md under "Releasing".
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the Release and attach binaries
  packages: write # push to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: a tag must pass the same checks as a PR before anything is published.
  # The tagged commit has usually been through CI already, but "usually" isn't
  # good enough for an artifact users will pull.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run lint
        working-directory: web
      - run: pnpm run check
        working-directory: web
      - run: pnpm run test
        working-directory: web
      - run: go vet ./...
        working-directory: backend
      - run: go test ./... -count=1
        working-directory: backend

  image:
    name: Publish image (amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-qemu-action: the Dockerfile pins both build stages to
      # $BUILDPLATFORM and cross-compiles via GOARCH, so nothing is emulated.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Publish binaries (linux amd64 + arm64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Built once and embedded into both binaries -- the SPA output is
      # architecture-independent.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make build-web

      - name: Cross-compile
        run: |
          set -eu
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-s -w -X github.com/shawn-bluce/renderbin/backend/internal/buildinfo.Version=${VERSION}"
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
               go build -trimpath -ldflags "$LDFLAGS" -o ../dist/renderbin ./cmd/server)
            # No version in the tarball name, on purpose: a versioned asset can
            # never be fetched through /releases/latest/download/, which is the
            # URL the README tells people to curl. The version is stamped into
            # the binary (buildinfo.Version) and reported by /api/health.
            tar -czf "dist/renderbin_linux_${arch}.tar.gz" \
              -C dist renderbin -C .. LICENSE README.md README.zh-CN.md
            rm dist/renderbin
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
